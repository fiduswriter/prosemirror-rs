[package]
name = "prosemirror-rs-wasm"
version = "0.4.1"
authors = [
    "Johannes Wilm <johannes@fiduswriter.org>",
]
edition = "2021"
license = "MIT"
description = "WebAssembly bindings for prosemirror-rs"
repository = "https://github.com/fiduswriter/prosemirror-rs"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
prosemirror = { path = ".." }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
